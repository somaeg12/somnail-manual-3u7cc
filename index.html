<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務マニュアル</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
 background:linear-gradient(135deg,#132a47,#1f4e79);min-height:100vh;display:flex;
 align-items:center;justify-content:center;padding:20px;color:#1a2332}
.box{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:420px;
 box-shadow:0 18px 50px rgba(0,0,0,.28)}
.lock{font-size:38px;text-align:center;margin-bottom:10px}
h1{font-size:19px;text-align:center;font-weight:700}
.sub{font-size:13px;color:#5b6b80;text-align:center;margin-top:6px;line-height:1.7}
form{margin-top:24px}
label{font-size:12.5px;font-weight:700;color:#5b6b80;display:block;margin-bottom:6px}
input[type=password]{width:100%;padding:13px 15px;border:1.5px solid #e2e8f0;border-radius:10px;
 font-size:16px;font-family:inherit;outline:none}
input[type=password]:focus{border-color:#1f6feb}
.remember{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:13px;color:#5b6b80}
.remember input{width:17px;height:17px;accent-color:#1f6feb}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#1f6feb;
 color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
button:hover{background:#1a5fd0}
button:disabled{background:#b6c2d1;cursor:default}
.msg{margin-top:14px;font-size:13px;text-align:center;min-height:20px;font-weight:600}
.msg.err{color:#d13438}
.msg.ok{color:#0f9d58}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:11.5px;
 color:#8896a8;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <div class="lock">🔒</div>
  <h1>業務マニュアル</h1>
  <div class="sub">SOM NAIL ／ 合同会社ソミマーケティング<br>閲覧にはパスワードが必要です</div>
  <form id="f">
    <label for="pw">パスワード</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <div class="remember"><input type="checkbox" id="rm" checked>
      <label for="rm" style="margin:0;font-weight:400;color:#5b6b80">このパソコンで次回から自動で開く</label></div>
    <button type="submit" id="go">開く</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="foot">このページの内容は暗号化して保存されています。<br>
    パスワードを入力するまで、中身を読むことはできません。</div>
</div>

    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, data);
  return new TextDecoder().decode(pt);
}

function show(html){
  document.open(); document.write(html); document.close();
}

async function attempt(pw, silent){
  if(!silent){ $("go").disabled = true; $("msg").className="msg"; $("msg").textContent = "解読しています…"; }
  try{
    const html = await unlock(pw);
    if(!silent){ $("msg").className="msg ok"; $("msg").textContent = "開きました"; }
    if($("rm").checked) localStorage.setItem(KEY, pw);
    setTimeout(()=>show(html), silent?0:120);
    return true;
  }catch(e){
    localStorage.removeItem(KEY);
    if(!silent){
      $("go").disabled = false;
      $("msg").className = "msg err";
      $("msg").textContent = "パスワードが違います";
      $("pw").select();
    }
    return false;
  }
}

if(!(window.crypto && window.crypto.subtle)){
  $("msg").className="msg err";
  $("msg").textContent = "このページは https:// のアドレスから開いてください";
  $("go").disabled = true;
}else{
  const saved = localStorage.getItem(KEY);
  if(saved) attempt(saved, true);
}

$("f").addEventListener("submit", e=>{ e.preventDefault(); attempt($("pw").value, false); });
</script>
